<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>睡房 v4 — 書枱中屏風</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@560;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1d1915;
    --muted: #5e564c;
    --line: rgba(29, 25, 21, 0.14);
    --paper: rgba(246, 241, 232, 0.92);
    --bronze: #8a5436;
    --plaster: #e4ddd2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #c5cdc8; color: var(--ink); }
  body {
    font-family: Outfit, "Noto Sans TC", sans-serif;
    font-weight: 400;
    overscroll-behavior: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #stage { position: fixed; inset: 0 348px 0 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  .glass {
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgba(40, 28, 16, 0.12);
    backdrop-filter: blur(10px);
  }
  aside.glass {
    position: fixed; top: 18px; right: 18px; bottom: 18px; width: 314px; z-index: 2;
    overflow: auto; padding: 16px 16px 18px;
  }
  aside h2 {
    font-family: Newsreader, "Noto Serif TC", serif;
    font-size: 22px; font-weight: 560;
    margin: 14px 0 6px; letter-spacing: -0.02em;
  }
  aside h2:first-child { margin-top: 0; }
  .modes, .views { display: flex; flex-wrap: wrap; gap: 6px; }
  .modes button, .views button {
    border: 1px solid var(--line); background: transparent;
    padding: 7px 10px; border-radius: 999px; font-size: 12.5px;
    transition: background 160ms ease, color 160ms ease;
  }
  .modes button:hover, .views button:hover { background: rgba(29, 25, 21, 0.06); }
  .modes button[aria-pressed="true"], .views button[aria-pressed="true"] {
    background: var(--ink); color: #f6f1e8; border-color: var(--ink);
  }
  .modes button[aria-pressed="true"]:hover, .views button[aria-pressed="true"]:hover {
    background: var(--ink);
  }
  .modes button:focus-visible, .views button:focus-visible {
    outline: 2px solid var(--bronze); outline-offset: 2px;
  }
  .note { color: var(--muted); font-size: 12.5px; line-height: 1.45; text-wrap: pretty; margin: 8px 0 0; }
  svg.plan { width: 100%; height: auto; display: block; margin-top: 8px; background: #fbf8f2; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
  #audit { font-size: 12px; margin: 8px 0 0; line-height: 1.45; text-wrap: pretty; }
  #audit.ok { color: #2d6a45; }
  #audit.bad { color: #8d2d2d; }
  .hint { position: fixed; left: 18px; bottom: 16px; z-index: 2; color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) {
    #stage { inset: 0 0 46vh 0; }
    aside.glass {
      top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: calc(46vh - 16px);
    }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto; transition: none !important; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<aside class="glass" id="sheet">
  <h2>睡房 v4</h2>
  <p class="note">進深 250（含窗台 40，地台 210）× 主窗 280 × 樓高 270。書枱只沿窗台，深 80，桌下左右各一個抽屜。書枱後各有一座書架，每格闊度相同，只有靠窗背版是透明玻璃，層架是木材，不放書。</p>
  <h2>觀察角度</h2>
  <div class="views" role="group" aria-label="觀察角度">
    <button type="button" data-view="axon" aria-pressed="true">總覽</button>
    <button type="button" data-view="entry">入口</button>
    <button type="button" data-view="window">窗台</button>
    <button type="button" data-view="desk">書桌</button>
    <button type="button" data-view="plan">俯視</button>
  </div>
  <svg class="plan" id="plan" role="img" aria-label="平面圖"></svg>
  <h2>Schedule</h2>
  <table id="schedule"></table>
  <p id="audit"></p>
  <p class="note" id="footnote"></p>
</aside>
<p class="hint">拖曳旋轉 · 滾輪縮放 · 右鍵平移 · 鍵 1–5</p>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script>
window.addEventListener("error", (ev) => {
  document.documentElement.dataset.audit = "js-error: " + (ev.message || "unknown");
});
(function () {
  try {
  // Centimetres. Origin: floor corner where the left wall meets the main window.
  // +X along the main window, left to right. +Z from the window toward the door. +Y up.
  // Meshes are placed from their minimum corner.
  const M = (cm) => cm / 100;
  const BITE = 0.4;

  function layoutOf(mode) {
    const roomX = 280, roomZ = 250, roomY = 270;
    const sillD = 40, sillH = 60;
    // Stacked bunk on the left. The window end meets the sill's inner face (z = 40),
    // so the frame does not sit on the stone. The foot meets the door wall.
    // Long axis runs toward the door, leaving the window run for the desk.
    const bunk = {
      x: 0, z: sillD, w: 100, d: roomZ - sillD,
      under: 145, deck: 6,
      mattX: 4, mattZ: 10, mattW: 91, mattD: 190,
      lowerBase: 38, lowerMatt: 12, upperMatt: 10
    };
    // Vertical rung ladder on the room side (+X), at the foot, flush to the door wall.
    const ladder = { z: roomZ - 44, w: 44, rungs: 6 };
    // Starts at the bunk's right face. Depth 80 from the window wall:
    // 40 on the sill, 40 on the floor. Runs to the right wall.
    const deskWin = {
      x: bunk.x + bunk.w, z: 0, w: roomX - (bunk.x + bunk.w), d: 80, top: 73, slab: 4
    };
    // One drawer under each half, on the floor side of the sill, between the legs.
    // Top meets the slab. Front is flush with the desk edge.
    const drawerY = 50;
    const drawerZ = 42;
    deskWin.drawers = [
      { x: deskWin.x + 9, w: 60 },
      { x: deskWin.x + 105, w: 66 }
    ].map((dr) => Object.assign(dr, {
      z: drawerZ, d: deskWin.d - drawerZ, y: drawerY, h: (deskWin.top - deskWin.slab) - drawerY
    }));
    // Run along the right wall. Depth into the room stays 60. Foot stays on the door wall.
    const tallD = 80;
    const tall = { x: roomX - 60, z: roomZ - tallD, w: 60, d: tallD, h: roomY };
    // On the right wall, from the sill's inner face to the tall cabinet.
    // Shallow. Bottom is 175 above the floor. Top meets the ceiling. Rice doors.
    // z starts at the lintel's inner face, so the beam and the cabinet share that face.
    const hang = {
      x: roomX - 32, z: sillD, w: 32, d: (roomZ - tallD) - sillD,
      y: 175, h: roomY - 175, bays: 3
    };
    // On the desktop centerline. Depth stays 120. With the desk at 80,
    // the last 40 cm reaches into the room and stands on the floor.
    const screen = {
      x: deskWin.x + deskWin.w / 2 - 2, z: deskWin.z, w: 4, d: 120,
      y: deskWin.top, h: 90, deskD: deskWin.d
    };
    // One chair centered on each side. Both face the window.
    const chairW = 40, chairD = 30;
    const chairZ = deskWin.z + deskWin.d - 12;
    const chairL = {
      x: deskWin.x + (screen.x - deskWin.x - chairW) / 2,
      z: chairZ, w: chairW, d: chairD
    };
    const chairR = {
      x: screen.x + screen.w + (deskWin.x + deskWin.w - (screen.x + screen.w) - chairW) / 2,
      z: chairZ, w: chairW, d: chairD
    };
    // One bookshelf on the window edge of each desktop. Both are the full
    // width of that half, so every book bay is the same width.
    const shelfT = 2, shelfBays = 2, shelfBoards = 4;
    const shelfW = screen.x - deskWin.x;
    const shelfBay = (shelfW - shelfT * 2 - shelfT * (shelfBays - 1)) / shelfBays;
    const bookcase = {
      z: 2, d: 26, y: deskWin.top, h: 98,
      bays: shelfBays, bay: shelfBay, boards: shelfBoards
    };
    const shelves = [deskWin.x, screen.x + screen.w].map((x) => Object.assign({ x, w: shelfW }, bookcase));
    // Negative yaw swings the leaf to +Z, into the corridor.
    const door = { x0: 128, x1: 208, h: 205, depth: 84, swing: -58 };
    // Centered on the full left wall. Width stays 64.
    const sideW = 64;
    const side = { z0: (roomZ - sideW) / 2, z1: (roomZ + sideW) / 2, sill: 96, head: 252 };
    const main = { x0: 12, x1: 268, sill: 60, head: 238 };
    // Downstand above the sill, full sill depth, from the window head to the ceiling.
    const lintel = { x: 0, z: 0, w: roomX, d: sillD, y: main.head, h: roomY - main.head };
    // Same head and drop on the door wall, only 10cm into the room.
    const doorBeam = { x: 0, z: roomZ - 10, w: roomX, d: 10, y: main.head, h: roomY - main.head };
    // Passage from the bunk face to the door jamb. The ladder adds 4 cm at the foot.
    const walk = door.x0 - (bunk.x + bunk.w);
    return {
      mode, roomX, roomZ, roomY, sillD, sillH, wall: 12,
      bunk, ladder, deskWin, tall, screen, chairL, chairR, hang, shelves,
      door, side, main, lintel, doorBeam, walk
    };
  }

  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xc5d0cc, 1);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, 1, 0.04, 80);
  const content = new THREE.Group();
  scene.add(content);

  const hemi = new THREE.HemisphereLight(0xf4f1ea, 0x8d6248, 0.48);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff3e4, 1.7);
  sun.position.set(0.9, 4.4, -2.4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 0.4;
  sun.shadow.camera.far = 16;
  sun.shadow.camera.left = -5;
  sun.shadow.camera.right = 5;
  sun.shadow.camera.top = 5;
  sun.shadow.camera.bottom = -5;
  sun.shadow.bias = -0.00045;
  sun.shadow.normalBias = 0.04;
  sun.target.position.set(1.35, 0.8, 1.15);
  scene.add(sun);
  scene.add(sun.target);
  const fill = new THREE.DirectionalLight(0xd5e4ea, 0.42);
  fill.position.set(2.6, 2.4, 4.2);
  scene.add(fill);
  const underLoft = new THREE.PointLight(0xfff1df, 0.55, 3.4, 2);
  underLoft.position.set(0.48, 1.05, 0.85);
  scene.add(underLoft);

  function canvasTex(w, h, draw, repeatX, repeatY) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.repeat.set(repeatX, repeatY);
    return t;
  }
  function plankMap(roomX, roomZ) {
    return canvasTex(512, 128, (g, w, h) => {
      g.fillStyle = "#4a2a1c";
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 9; i++) {
        const tone = 70 + (i % 3) * 18;
        g.fillStyle = `rgb(${tone + 48}, ${Math.max(20, tone - 18)}, ${Math.max(12, tone - 48)})`;
        g.fillRect(0, i * (h / 9), w, h / 9 - 1);
        g.strokeStyle = "rgba(40,18,10,0.35)";
        g.beginPath();
        for (let x = 8; x < w; x += 7) {
          g.moveTo(x, i * (h / 9) + 2);
          g.lineTo(x + 10, (i + 1) * (h / 9) - 3);
        }
        g.stroke();
      }
    }, roomX / 130, roomZ / 108);
  }
  function graniteMap() {
    return canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#c4c1ba";
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 2200; i++) {
        const v = 90 + Math.random() * 140;
        g.fillStyle = `rgba(${v}, ${v}, ${v + 6}, ${0.18 + Math.random() * 0.45})`;
        g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2.2, 1 + Math.random() * 2.2);
      }
    }, 1.6, 1.2);
  }

  const mat = {};
  function makeMaterials(L) {
    const wall = new THREE.MeshStandardMaterial({ color: 0xf4f0e8, roughness: 0.92 });
    const oak = new THREE.MeshStandardMaterial({ color: 0xc6a36a, roughness: 0.62 });
    const oakDark = new THREE.MeshStandardMaterial({ color: 0x8d6436, roughness: 0.7 });
    const floor = new THREE.MeshStandardMaterial({ map: plankMap(L.roomX, L.roomZ), roughness: 0.78, metalness: 0.02 });
    const stone = new THREE.MeshStandardMaterial({ map: graniteMap(), color: 0xd5d2cb, roughness: 0.55 });
    const linen = new THREE.MeshStandardMaterial({ color: 0xefe6d6, roughness: 0.92 });
    const quilt = new THREE.MeshStandardMaterial({ color: 0xe3d0b6, roughness: 0.9 });
    const quilt2 = new THREE.MeshStandardMaterial({ color: 0xd9c6aa, roughness: 0.9 });
    const pillow = new THREE.MeshStandardMaterial({ color: 0xf7f3ec, roughness: 0.86 });
    const cloth = new THREE.MeshStandardMaterial({ color: 0xd9c7a4, roughness: 0.95, side: THREE.DoubleSide });
    const cloth2 = new THREE.MeshStandardMaterial({ color: 0xc9c3b8, roughness: 0.95 });
    const frame = new THREE.MeshStandardMaterial({ color: 0x596066, roughness: 0.38, metalness: 0.55 });
    const glass = new THREE.MeshStandardMaterial({
      color: 0xc9e0ea, transparent: true, opacity: 0.18, roughness: 0.04, metalness: 0.05, side: THREE.DoubleSide
    });
    const door = new THREE.MeshStandardMaterial({ color: 0x5c3a2a, roughness: 0.55 });
    const drawer = new THREE.MeshStandardMaterial({ color: 0xf7f4ee, roughness: 0.55 });
    const rice = new THREE.MeshStandardMaterial({ color: 0xf6f1e4, roughness: 0.52 });
    const ground = new THREE.MeshStandardMaterial({ color: 0xb7c0b4, roughness: 1 });
    const beamMat = new THREE.MeshStandardMaterial({ color: 0xe7e0d4, roughness: 0.94 });
    Object.assign(mat, {
      wall, oak, oakDark, floor, stone, linen, quilt, quilt2, pillow, cloth, cloth2,
      frame, glass, door, drawer, rice, ground, beam: beamMat
    });
  }

  const boxes = [];
  function addBox(parent, x, y, z, w, h, d, material, name, flags) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(M(w), M(h), M(d)), material);
    mesh.position.set(M(x + w / 2), M(y + h / 2), M(z + d / 2));
    const seeThrough = material.transparent || (flags && flags.indexOf("glass") >= 0);
    mesh.castShadow = !seeThrough;
    mesh.receiveShadow = !seeThrough;
    mesh.name = name || "";
    parent.add(mesh);
    boxes.push({ name: name || "box", x, y, z, w, h, d, flags: flags || "" });
    return mesh;
  }

  function disposeGroup(group) {
    group.traverse((obj) => {
      if (obj.geometry) obj.geometry.dispose();
    });
    group.clear();
  }

  let current = null;
  let viewName = "axon";

  function build(L) {
    disposeGroup(content);
    boxes.length = 0;
    Object.values(mat).forEach((m) => {
      if (m && m.map) m.map.dispose();
      if (m && m.dispose) m.dispose();
    });
    makeMaterials(L);

    const X = L.roomX, Z = L.roomZ, Y = L.roomY, t = L.wall;
    addBox(content, -80, -30, -90, X + 280, 28, Z + 320, mat.ground, "ground", "outside");
    addBox(content, 0, -8, 0, X, 8, Z, mat.floor, "floor");

    const ceilings = new THREE.Group();
    content.add(ceilings);
    content.userData.ceiling = ceilings;
    addBox(ceilings, -t, Y, -t, X + t * 2, 8, Z + t * 2, mat.wall, "ceiling");

    addShell(L);
    addWindows(L);
    addLintel(L);
    addBunk(L);
    addLadder(L);
    addDesk(L.deskWin, "window");
    addBookshelves(L);
    addChair(L.chairL.x, L.chairL.z, L.chairL.w, L.chairL.d, "window");
    addChair(L.chairR.x, L.chairR.z, L.chairR.w, L.chairR.d, "window");
    addScreen(L);
    addHang(L);
    addTallRobe(L);
    addDoor(L);
  }

  function addShell(L) {
    const X = L.roomX, Z = L.roomZ, Y = L.roomY, t = L.wall;
    const W = L.main, S = L.side, D = L.door;

    // Main window wall, inner face z = 0. Pieces do not share volume.
    addBox(content, -t, W.head, -t, X + t * 2, Y - W.head, t, mat.wall, "wall-window-head");
    addBox(content, -t, 0, -t, X + t * 2, W.sill, t, mat.wall, "wall-window-breast");
    addBox(content, -t, W.sill, -t, W.x0 + t, W.head - W.sill, t, mat.wall, "wall-window-jamb");
    addBox(content, W.x1, W.sill, -t, X + t - W.x1, W.head - W.sill, t, mat.wall, "wall-window-jamb");

    // Left wall, side window. Inner face x = 0.
    addBox(content, -t, S.head, 0, t, Y - S.head, Z, mat.wall, "wall-side-head");
    addBox(content, -t, 0, 0, t, S.sill, Z, mat.wall, "wall-side-breast");
    addBox(content, -t, S.sill, 0, t, S.head - S.sill, S.z0, mat.wall, "wall-side-jamb");
    addBox(content, -t, S.sill, S.z1, t, S.head - S.sill, Z - S.z1, mat.wall, "wall-side-jamb");

    // Right wall, solid.
    const cut = new THREE.Group();
    content.add(cut);
    content.userData.cutaway = cut;
    addBox(cut, X, 0, 0, t, Y, Z, mat.wall, "wall-right");

    // Door wall, inner face z = Z. The leaf swings past this face, into the corridor.
    addBox(cut, -t, D.h, Z, X + t * 2, Y - D.h, t, mat.wall, "wall-door-head");
    addBox(cut, -t, 0, Z, D.x0 + t, D.h, t, mat.wall, "wall-door-left");
    addBox(cut, D.x1, 0, Z, X + t - D.x1, D.h, t, mat.wall, "wall-door-right");

    const cZ = Z + t;
    const cD = D.depth - t;
    addBox(cut, D.x0, -8, Z, D.x1 - D.x0, 8, D.depth, mat.floor, "floor");
    addBox(content.userData.ceiling, D.x0 - t, Y, Z, (D.x1 - D.x0) + t * 2, 8, D.depth + t, mat.wall, "ceiling");
    addBox(cut, D.x0 - t, 0, cZ, t, Y, cD, mat.wall, "wall-corridor");
    addBox(cut, D.x1, 0, cZ, t, Y, cD, mat.wall, "wall-corridor");

    // Granite sill along the whole main window.
    addBox(content, 0, 0, 0, X, L.sillH - 3, L.sillD, mat.wall, "sill");
    addBox(content, 0, L.sillH - 3, 0, X, 3, L.sillD, mat.stone, "sill-cap");
    // Narrow stone lip on the side window. The bunk posts stand clear of it.
    addBox(content, 0, S.sill - 3, S.z0, 8, 3, S.z1 - S.z0, mat.stone, "sill-side");
  }

  function addWindows(L) {
    const W = L.main, S = L.side, Z = L.roomZ;
    const glassY = W.sill + 2;
    const glassH = W.head - W.sill - 4;
    addBox(content, W.x0, W.sill, -1.5, W.x1 - W.x0, 3, 3, mat.frame, "frame", "trim");
    addBox(content, W.x0, W.head - 3, -1.5, W.x1 - W.x0, 3, 3, mat.frame, "frame", "trim");
    addBox(content, W.x0, W.sill, -1.5, 3, W.head - W.sill, 3, mat.frame, "frame", "trim");
    addBox(content, W.x1 - 3, W.sill, -1.5, 3, W.head - W.sill, 3, mat.frame, "frame", "trim");
    const midX = (W.x0 + W.x1) / 2;
    addBox(content, midX - 1.4, glassY, -2.2, 2.8, glassH, 2.4, mat.frame, "mullion", "trim");
    addBox(content, W.x0 + 3, 148, -2.2, W.x1 - W.x0 - 6, 2.8, 2.4, mat.frame, "mullion", "trim");
    addBox(content, W.x0 + 4, glassY, -1.2, W.x1 - W.x0 - 8, glassH, 0.8, mat.glass, "glass-main", "glass");

    addBox(content, -1.5, S.sill, S.z0, 3, 3, S.z1 - S.z0, mat.frame, "frame", "trim");
    addBox(content, -1.5, S.head - 3, S.z0, 3, 3, S.z1 - S.z0, mat.frame, "frame", "trim");
    addBox(content, -1.5, S.sill, S.z0, 3, S.head - S.sill, 3, mat.frame, "frame", "trim");
    addBox(content, -1.5, S.sill, S.z1 - 3, 3, S.head - S.sill, 3, mat.frame, "frame", "trim");
    addBox(content, -1.2, S.sill + 3, S.z0 + 4, 0.8, S.head - S.sill - 6, S.z1 - S.z0 - 8, mat.glass, "glass-side", "glass");

    addBox(content, W.x0 + 2, W.sill, -9, 16, W.head - W.sill, 5, mat.cloth, "curtain", "outside");
    addBox(content, W.x1 - 18, W.sill, -9, 16, W.head - W.sill, 5, mat.cloth, "curtain", "outside");

  function overlap(a, b, eps) {
    const dx = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const dy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    const dz = Math.min(a.z + a.d, b.z + b.d) - Math.max(a.z, b.z);
    if (dx > eps && dy > eps && dz > eps) return [dx, dy, dz];
    return null;
  }

  function audit(L) {
    const skip = /glass|frame|mullion|curtain|ground|vent|handle|notebook|pull|rod|garment/;
    const shell = /^wall|^floor|^ceiling|^sill/;
    const solid = boxes.filter((b) => !skip.test(b.name) && b.flags.indexOf("glass") < 0 && b.flags.indexOf("trim") < 0 && b.flags.indexOf("outside") < 0 && b.flags.indexOf("door") < 0);
    const clashes = [];
    for (let i = 0; i < solid.length; i++) {
      const a = solid[i];
      if (!shell.test(a.name)) {
        if (a.x < -0.5 || a.y < -0.5 || a.z < -0.5 || a.x + a.w > L.roomX + 0.5 || a.z + a.d > L.roomZ + 0.5 || a.y + a.h > L.roomY + 1) {
          clashes.push(a.name + " outside room");
        }
      }
      for (let j = i + 1; j < solid.length; j++) {
        const b = solid[j];
        if (shell.test(a.name) && shell.test(b.name)) continue;
        const o = overlap(a, b, 0.8);
        if (o) clashes.push(a.name + " × " + b.name);
      }
    }
    return clashes;
  }

  const target = new THREE.Vector3();
  const spherical = new THREE.Spherical();
  const offset = new THREE.Vector3();
  let dragging = false;
  let dragMode = "rot";
  let lastX = 0, lastY = 0;

  function syncOrbit() {
    offset.copy(camera.position).sub(target);
    spherical.setFromVector3(offset);
  }
  function applyOrbit() {
    spherical.phi = Math.max(0.12, Math.min(1.45, spherical.phi));
    spherical.radius = Math.max(0.45, Math.min(12, spherical.radius));
    offset.setFromSpherical(spherical);
    camera.position.copy(target).add(offset);
    if (camera.position.y < 0.16) camera.position.y = 0.16;
    camera.lookAt(target);
  }
  function setView(name) {
    const L = current;
    viewName = name;
    camera.up.set(0, 1, 0);
    const X = M(L.roomX), Z = M(L.roomZ);
    const ceilingOn = name === "entry" || name === "window" || name === "desk";
    if (content.userData.ceiling) content.userData.ceiling.visible = ceilingOn;
    if (content.userData.cutaway) content.userData.cutaway.visible = name !== "axon";
    camera.fov = name === "desk" ? 52 : name === "entry" ? 48 : 42;
    if (name === "entry") {
      // Free jamb of the corridor, just outside the room. The leaf swings
      // the other way, so this line of sight stays in the opening.
      const jambX = M(L.door.x1);
      camera.position.set(jambX - 0.14, 1.48, Z + 0.22);
      target.set(1.22, 0.82, 0.55);
    } else if (name === "window") {
      // Open floor, looking at the rice doors. Cabinet is y 175–270, x≥248, z 40–170.
      // Clear of the bunk (x≤100), the screen (ends z 120) and the wardrobe (z≥170, x≥220).
      camera.position.set(1.15, 1.78, 1.85);
      target.set(2.55, 2.22, 1.05);
    } else if (name === "desk") {
      // Left of the screen, high enough to see the bookshelves on the desktop.
      // Shelves end z 28 and y 171. Screen ends z 120. Wardrobe is x 220, z 170.
      camera.position.set(1.55, 1.55, 2.15);
      target.set(1.9, 1.15, 0.25);
    } else if (name === "plan") {
      camera.up.set(0, 0, -1);
      camera.position.set(X / 2, 6.2, Z / 2);
      target.set(X / 2, 0, Z / 2);
    } else {
      camera.position.set(X + 0.35, 4.6, Z + 1.15);
      target.set(1.2, 0.55, 0.85);
    }
    camera.lookAt(target);
    camera.updateProjectionMatrix();
    syncOrbit();
    document.querySelectorAll("[data-view]").forEach((btn) => {
      btn.setAttribute("aria-pressed", btn.dataset.view === name ? "true" : "false");
    });
  }

  renderer.domElement.addEventListener("pointerdown", (e) => {
    dragging = true;
    dragMode = e.button === 2 || e.shiftKey ? "pan" : "rot";
    lastX = e.clientX; lastY = e.clientY;
    if (camera.up.y < 0.9) {
      camera.up.set(0, 1, 0);
      camera.lookAt(target);
      syncOrbit();
    }
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener("pointerup", () => { dragging = false; });
  renderer.domElement.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (dragMode === "rot") {
      spherical.theta -= dx * 0.005;
      spherical.phi -= dy * 0.005;
      applyOrbit();
    } else {
      camera.updateMatrixWorld();
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
      const scale = spherical.radius * 0.0016;
      target.addScaledVector(right, -dx * scale);
      target.addScaledVector(up, dy * scale);
      applyOrbit();
    }
  });
  renderer.domElement.addEventListener("wheel", (e) => {
    e.preventDefault();
    spherical.radius *= e.deltaY > 0 ? 1.08 : 0.92;
    applyOrbit();
  }, { passive: false });
  renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

  window.addEventListener("keydown", (e) => {
    const map = { "1": "axon", "2": "entry", "3": "window", "4": "desk", "5": "plan" };
    if (map[e.key]) setView(map[e.key]);
  });

  function svgEl(name, attrs) {
    const n = document.createElementNS("http://www.w3.org/2000/svg", name);
    Object.keys(attrs).forEach((k) => n.setAttribute(k, attrs[k]));
    return n;
  }
  function drawPlan(L) {
    const svg = document.getElementById("plan");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const padL = 36, padT = 36, padR = 92, padB = 58;
    const extra = L.door.depth;
    const vbW = L.roomX + padL + padR;
    const vbH = L.roomZ + extra + padT + padB;
    svg.setAttribute("viewBox", `0 0 ${vbW} ${vbH}`);
    const g = svgEl("g", { transform: `translate(${padL} ${padT})` });
    svg.appendChild(g);
    function rect(x, z, w, d, fill, stroke, sw) {
      g.appendChild(svgEl("rect", {
        x, y: z, width: w, height: d, fill: fill || "none",
        stroke: stroke || "none", "stroke-width": sw || 0
      }));
    }
    function line(x1, z1, x2, z2, stroke, sw) {
      g.appendChild(svgEl("line", {
        x1, y1: z1, x2, y2: z2, stroke, "stroke-width": sw || 1
      }));
    }
    function label(x, z, text, size, anchor) {
      const t = svgEl("text", {
        x, y: z, fill: "#1d1915", "font-size": size || 11,
        "font-family": "Outfit, Noto Sans TC, sans-serif",
        "text-anchor": anchor || "middle"
      });
      t.textContent = text;
      g.appendChild(t);
    }
    rect(-12, -12, L.roomX + 24, L.roomZ + 24, "#1c1c1c");
    rect(0, 0, L.roomX, L.roomZ, "#f4f0e6");
    rect(L.door.x0, L.roomZ, L.door.x1 - L.door.x0, L.door.depth, "#efe6d4");
    rect(0, 0, L.roomX, L.sillD, "#e4e1da");
    rect(-6, L.side.z0, 6, L.side.z1 - L.side.z0, "#d5e3ea");
    rect(L.main.x0, -6, L.main.x1 - L.main.x0, 6, "#d5e3ea");

    const F = L.bunk;
    rect(0, 0, L.lintel.w, L.lintel.d, "rgba(90,86,78,0.16)", "#5c564c", 1.2);
    rect(L.deskWin.x, L.deskWin.z, L.deskWin.w, L.deskWin.d, "#c6b0de", "#6d5a88", 1);
    rect(L.chairL.x, L.chairL.z, L.chairL.w, L.chairL.d, "#efe6d6", "#8d6436", 0.8);
    rect(L.chairR.x, L.chairR.z, L.chairR.w, L.chairR.d, "#efe6d6", "#8d6436", 0.8);
    rect(F.x, F.z, F.w, F.d, "rgba(232,177,92,0.55)", "#9a6a28", 1.5);
    rect(F.x + F.w, L.ladder.z, 4, L.ladder.w, "#e7d3b4", "#8d6436", 1.2);
    rect(L.screen.x, L.screen.z, L.screen.w, L.screen.d, "#efe6d6", "#8a5436", 1.4);
    rect(L.tall.x, L.tall.z, L.tall.w, L.tall.d, "#2f5288", "#1d3358", 1.2);
    rect(L.hang.x, L.hang.z, L.hang.w, L.hang.d, "rgba(198,163,106,0.72)", "#8d6436", 1.2);
    L.shelves.forEach((S) => rect(S.x, S.z, S.w, S.d, "#e7d3b4", "#8d6436", 1.2));

    rect(L.doorBeam.x, L.doorBeam.z, L.doorBeam.w, L.doorBeam.d, "rgba(90,86,78,0.35)", "#5c564c", 1.2);
    label(50, 18, "橫梁", 10);
    label(150, L.doorBeam.z + 7, "橫梁", 9);
    label(F.x + F.w / 2, F.z + F.d / 2, "上下架床");
    label(L.chairL.x + L.chairL.w / 2, L.deskWin.d / 2 + 4, "書枱");
    label(L.screen.x + L.screen.w / 2, L.screen.z + L.screen.d + 12, "屏風", 11);
    label(L.shelves[0].x + L.shelves[0].w / 2, L.shelves[0].z + L.shelves[0].d / 2, "書架", 10);
    label(F.x + F.w + 8, L.ladder.z + 16, "排梯", 10, "start");
    label(L.tall.x + 8, L.tall.z + L.tall.d / 2, "到頂櫃", 10, "start");
    label(L.hang.x + L.hang.w / 2, L.hang.z + L.hang.d / 2, "吊櫃", 10);

    const leaf = L.door.x1 - L.door.x0;
    const open = Math.abs(L.door.swing) * Math.PI / 180;
    const tipX = L.door.x0 + leaf * Math.cos(open);
    const tipZ = L.roomZ + leaf * Math.sin(open);
    line(L.door.x0, L.roomZ, tipX, tipZ, "#5c3a2a", 1.6);
    const arc = svgEl("path", {
      d: `M ${L.door.x1} ${L.roomZ} A ${leaf} ${leaf} 0 0 1 ${tipX} ${tipZ}`,
      fill: "none", stroke: "#5c3a2a", "stroke-width": 0.8
    });
    g.appendChild(arc);

    line(0, -18, L.roomX, -18, "#8a5436");
    line(0, -22, 0, -14, "#8a5436");
    line(L.roomX, -22, L.roomX, -14, "#8a5436");
    label(L.roomX / 2, -22, "280 主窗");
    line(L.roomX + 18, 0, L.roomX + 18, L.roomZ, "#8a5436");
    line(L.roomX + 14, 0, L.roomX + 22, 0, "#8a5436");
    line(L.roomX + 14, L.sillD, L.roomX + 22, L.sillD, "#8a5436");
    line(L.roomX + 14, L.roomZ, L.roomX + 22, L.roomZ, "#8a5436");
    label(L.roomX + 26, L.sillD / 2 + 3, "窗台 40", 9, "start");
    label(L.roomX + 26, (L.sillD + L.roomZ) / 2, "地台 " + (L.roomZ - L.sillD), 9, "start");
    label(L.roomX + 26, L.roomZ + 16, "進深 250", 9, "start");
    label(-8, (L.side.z0 + L.side.z1) / 2, "側窗", 9, "end");
    label((L.door.x0 + L.door.x1) / 2, L.roomZ + L.door.depth + 14, "門 向外");
  }

  function fillSheet(L, clashes) {
    const F = L.bunk;
    const deckTop = F.under + F.deck;
    const upperSleep = deckTop + F.upperMatt;
    const lowerSleep = F.lowerBase + F.lowerMatt;
    const onSill = L.sillD - L.deskWin.z;
    const onFloor = L.deskWin.d - onSill;
    const rows = [
      ["房間", L.roomZ + " × " + L.roomX + " × " + L.roomY],
      ["進深", L.roomZ + "，含窗台 " + L.sillD + "，地台 " + (L.roomZ - L.sillD)],
      ["主窗牆", L.roomX],
      ["主窗窗台", L.sillD + " 深 × " + L.sillH + " 高，已計入進深"],
      ["側窗", (L.side.z1 - L.side.z0) + " 闊，居左牆中，台 " + L.side.sill + "，頂 " + L.side.head],
      ["上下架外框", F.w + " × " + F.d + "，床頭貼窗台內緣，床尾貼門牆"],
      ["上架床褥", F.mattW + " × " + F.mattD + "，床底 " + F.under + "，床面 " + upperSleep],
      ["下架床褥", F.mattW + " × " + F.mattD + "，床面 " + lowerSleep],
      ["上架淨空", (L.roomY - upperSleep) + "（床面至天花）"],
      ["下架坐高", (F.under - lowerSleep) + "（床面至上架床底）"],
      ["窗台橫梁", L.lintel.w + " 闊 × " + L.lintel.d + " 深 × " + L.lintel.h + "，底 " + L.lintel.y],
      ["門牆橫梁", L.doorBeam.w + " 闊 × " + L.doorBeam.d + " 深 × " + L.doorBeam.h + "，底 " + L.doorBeam.y],
      ["窗台書枱", L.deskWin.w + " × " + L.deskWin.d + " × " + L.deskWin.top + "，" + onSill + " 在窗台，" + onFloor + " 在地台"],
      ["桌下抽屜", "左右各一，左 " + L.deskWin.drawers[0].w + " 闊、右 " + L.deskWin.drawers[1].w + " 闊，深 " + L.deskWin.drawers[0].d + "，高 " + L.deskWin.drawers[0].h + "，底 " + L.deskWin.drawers[0].y + "，頂貼桌底，前面齊桌緣"],
      ["屏風", L.screen.w + " 厚 × " + L.screen.d + " 深。桌面上高 " + L.screen.h + "、底 " + L.screen.y + "；向房內多 " + (L.screen.d - L.screen.deskD) + "，該段落地，頂 " + (L.screen.y + L.screen.h)],
      ["書椅", "左右各一，" + L.chairL.w + " × " + L.chairL.d],
      ["書架", "左右各一，" + L.shelves[0].w + " 闊 × " + L.shelves[0].d + " 深 × " + L.shelves[0].h + " 高，每邊 " + L.shelves[0].bays + " 格，格闊 " + L.shelves[0].bay + "，背版透明玻璃，層架木材，不放書"],
      ["排梯", L.ladder.w + " 闊，直身，" + L.ladder.rungs + " 橫檔，升 " + deckTop],
      ["到頂櫃", L.tall.d + " 闊 × " + L.tall.w + " 深 × " + L.tall.h + "，門米白，貼門牆"],
      ["中空吊櫃", L.hang.d + " 闊 × " + L.hang.w + " 深 × " + L.hang.h + " 高，底 " + L.hang.y + "，頂到天花，" + L.hang.bays + " 格，門米白"],
      ["床側至門框", L.walk],
      ["房門", (L.door.x1 - L.door.x0) + " × " + L.door.h + "，向外開"]
    ];
    const table = document.getElementById("schedule");
    table.innerHTML = "<tr><th>Piece</th><th>cm</th></tr>" + rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
    const auditEl = document.getElementById("audit");
    if (clashes.length) {
      auditEl.className = "bad";
      auditEl.textContent = "Fit check: " + clashes.slice(0, 6).join("; ");
    } else {
      auditEl.className = "ok";
      auditEl.textContent = "幾何沒有重疊。中空吊櫃底 " + L.hang.y + "，頂到天花。床側離門框 " + L.walk + "cm。";
    }
    const foot = document.getElementById("footnote");
    foot.textContent = "上下架床外框 " + F.w + " × " + F.d + "，床頭齊窗台內緣（離主窗 " + F.z + "），床尾貼門牆，不壓在石面上。上架床底 " + F.under + "，床面 " + upperSleep + "，以上 " + (L.roomY - upperSleep) + " 到天花。下架床面 " + lowerSleep + "，至上架床底還有 " + (F.under - lowerSleep) + "。窗台書枱從下架床右邊開始，深 " + L.deskWin.d + "，其中 " + onSill + " 在窗台上、" + onFloor + " 在地台，沿窗伸到右牆，不再轉入右牆。桌下左右各一個抽屜，底 " + L.deskWin.drawers[0].y + "，高 " + L.deskWin.drawers[0].h + "，深 " + L.deskWin.drawers[0].d + "，頂貼桌底，前面齊桌緣。右邊到頂櫃闊 " + L.tall.d + "，深仍是 " + L.tall.w + "，貼門牆，櫃門米白。屏風厚 " + L.screen.w + "，深 " + L.screen.d + "，桌面上高 " + L.screen.h + "、底 " + L.screen.y + "，多出的 " + (L.screen.d - L.screen.deskD) + " 向房內伸出並落地，頂 " + (L.screen.y + L.screen.h) + "。左右各一張書椅。兩張書枱靠窗後緣各一座書架，闊 " + L.shelves[0].w + "，深 " + L.shelves[0].d + "，高 " + L.shelves[0].h + "，每邊 " + L.shelves[0].bays + " 格，格闊都是 " + L.shelves[0].bay + "。書架只有整塊靠窗背版是透明玻璃，底版、中間層板、上層層板、頂板、側板和中柱是橡木，三層不放書。右牆中空吊櫃由窗台內緣到到頂櫃，闊 " + L.hang.d + "，深 " + L.hang.w + "，底 " + L.hang.y + "，高 " + L.hang.h + "，頂到天花，" + L.hang.bays + " 格，門米白。排梯在床尾靠房一側，直身，" + L.ladder.w + " 闊，升 " + deckTop + "。床側離門框 " + L.walk + "cm。窗台橫梁深 " + L.lintel.d + "，底 " + L.lintel.y + "。門牆橫梁深 " + L.doorBeam.d + "，同樣底 " + L.doorBeam.y + "。房門向外開。";
    drawPlan(L);
  }

  function resize() {
    const w = stage.clientWidth || 1;
    const h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  function applyMode(mode) {
    current = layoutOf(mode);
    build(current);
    const clashes = audit(current);
    fillSheet(current, clashes);
    document.documentElement.dataset.audit = clashes.length ? clashes.join(" | ") : "ok";
    document.documentElement.dataset.mode = mode;
    document.documentElement.dataset.walk = String(current.walk);
    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.setAttribute("aria-pressed", btn.dataset.mode === mode ? "true" : "false");
    });
    setView(viewName);
    resize();
    renderer.render(scene, camera);
  }

  document.querySelectorAll("[data-view]").forEach((btn) => {
    btn.addEventListener("click", () => setView(btn.dataset.view));
  });
  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => applyMode(btn.dataset.mode));
  });

  const q = new URLSearchParams(location.search);
  viewName = ["entry", "window", "axon", "plan", "desk"].includes(q.get("view")) ? q.get("view") : "axon";
  if (q.get("clean") === "1") {
    document.querySelectorAll("aside, .hint").forEach((n) => { n.style.display = "none"; });
    stage.style.inset = "0";
  }
  applyMode(q.get("mode") === "sketch" ? "sketch" : "confirmed");

  function frame() {
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__ready = true;
  } catch (err) {
    document.documentElement.dataset.audit = "js-error: " + (err.message || err);
    const el = document.getElementById("audit");
    if (el) { el.className = "bad"; el.textContent = String(err && err.message || err); }
    console.error(err);
  }
})();
</script>
</body>
</html>
